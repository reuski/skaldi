name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
      - uses: actions/setup-go@main
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build
        run: just release-build

      - name: Publish
        uses: softprops/action-gh-release@master
        with:
          files: dist/*
          generate_release_notes: true
